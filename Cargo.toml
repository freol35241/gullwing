[package]
name = "gullwing"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.70"
authors = ["Fredrik Olsson <freol@outlook.com>"]
license = "Apache-2.0"
description = "Runtime formatting and parsing with Python's Format Specification Mini-Language"
repository = "https://github.com/freol35241/gullwing"
documentation = "https://docs.rs/gullwing"
keywords = ["format", "parse", "string", "formatting", "parsing"]
categories = ["parsing", "text-processing"]
readme = "README.md"

[dependencies]
regex = "1.10"
thiserror = "1.0"
lazy_static = "1.4"

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
pretty_assertions = "1.4"

[[bench]]
name = "format_spec"
harness = false

[[bench]]
name = "formatting"
harness = false

[[bench]]
name = "parsing"
harness = false
